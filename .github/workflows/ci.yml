name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only changes skip CI (tag pushes always run: GitHub does not
    # apply paths filters to tags).
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write  # required for the github-release job to upload assets

env:
  # The Quack server the integration tests run against. Pinned: a DuckDB
  # release changes the protocol's server side.
  DUCKDB_VERSION: v2.0.0

jobs:
  test:
    # Unit tests, integration tests against a real DuckDB 2.0 Quack server
    # (they fail, never skip, when it is missing), the TLS tests, and the
    # -Poracle parity tests against DuckDB's own JDBC driver. The bytecode
    # targets Java 17 (--release 17); it is tested on 17 and on the
    # current LTS.
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Install DuckDB CLI ${{ env.DUCKDB_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/duckdb-cli"
          curl -fsSL --retry 3 \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb-cli-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/duckdb-cli"
          echo "$HOME/duckdb-cli" >> "$GITHUB_PATH"
          "$HOME/duckdb-cli/duckdb" --version

      - name: Build and run all tests (incl. DuckDB JDBC parity)
        run: mvn --batch-mode --no-transfer-progress -Poracle verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/

  publish:
    name: Publish to Maven Central
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25 with Central credentials
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -Prelease deploy -DskipTests

  github-release:
    name: Attach jars to GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package versioned + sources + javadoc jars
        run: mvn --batch-mode --no-transfer-progress -Prelease package -DskipTests

      - name: Derive version and copy un-versioned jars
        id: artifacts
        run: |
          set -euo pipefail
          VERSION=$(mvn --batch-mode --no-transfer-progress \
                       -q -Dexec.executable=echo -Dexec.args='${project.version}' \
                       --non-recursive exec:exec)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release
          cp "target/quack-jdbc-${VERSION}.jar"          "release/quack-jdbc-${VERSION}.jar"
          cp "target/quack-jdbc-${VERSION}.jar"          "release/quack-jdbc.jar"
          if [ -f "target/quack-jdbc-${VERSION}-sources.jar" ]; then
            cp "target/quack-jdbc-${VERSION}-sources.jar"  "release/quack-jdbc-${VERSION}-sources.jar"
            cp "target/quack-jdbc-${VERSION}-sources.jar"  "release/quack-jdbc-sources.jar"
          fi
          if [ -f "target/quack-jdbc-${VERSION}-javadoc.jar" ]; then
            cp "target/quack-jdbc-${VERSION}-javadoc.jar"  "release/quack-jdbc-${VERSION}-javadoc.jar"
            cp "target/quack-jdbc-${VERSION}-javadoc.jar"  "release/quack-jdbc-javadoc.jar"
          fi
          (cd release && sha256sum * > SHA256SUMS)
          ls -la release/

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          # Strip the leading 'v' from the tag (refs/tags/v1.2.3 -> 1.2.3)
          # and pull the matching "## [VERSION] ..." section out of
          # CHANGELOG.md (stop at the next "## [" heading). Save to
          # release_notes.md; fall back to auto-generated notes if the
          # section is missing so the release still gets created.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting release notes for version: ${VERSION}"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ -s release_notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
            echo "---- release_notes.md ----"
            cat release_notes.md
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: no matching CHANGELOG section for ${VERSION}; release will use auto-generated notes."
          fi

      - name: Create / update GitHub Release with assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.have_notes == 'true' && 'release_notes.md' || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.have_notes != 'true' }}
          files: |
            release/quack-jdbc-${{ steps.artifacts.outputs.version }}.jar
            release/quack-jdbc.jar
            release/quack-jdbc-${{ steps.artifacts.outputs.version }}-sources.jar
            release/quack-jdbc-sources.jar
            release/quack-jdbc-${{ steps.artifacts.outputs.version }}-javadoc.jar
            release/quack-jdbc-javadoc.jar
            release/SHA256SUMS
          fail_on_unmatched_files: false
